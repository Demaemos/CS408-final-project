spring.application.name=lcg

# Used by ./start.sh (the "dev" profile) only.
# Throwaway admin account for local development and for graders running ./start.sh.
# Never use these values in production: there, set LCG_ADMIN_PASSWORD in /etc/lcg/app.env.
lcg.admin.username=admin
lcg.admin.password=admin-dev-password

# Override with a comma-separated list (or LCG_COMMENTS_BLOCKED_TERMS) for moderation.
lcg.comments.blocked-terms=shit,fuck,asshole,bitch,bastard,cunt,dick,piss,slut,whore