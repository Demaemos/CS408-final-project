<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="thread(comment, commentBase, depth)">
    <article class="card mb-2" th:classappend="${depth > 0} ? 'ms-3' : ''">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <strong th:text="${comment.user.username}">User</strong>
                <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'MMMM d, yyyy')}">Date</small>
            </div>
            <div class="mt-2" th:text="${comment.body}" style="white-space: pre-wrap;">Body</div>
            <div class="d-flex gap-2 mt-3" th:if="${session.userId != null}">
                <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="this.closest('.card-body').querySelector('.comment-reply-form').hidden = false; this.hidden = true;">
                    Reply
                </button>
                <button type="button" class="btn btn-sm btn-outline-primary"
                        th:if="${session.role != 'ADMIN' and session.userId == comment.user.id}"
                        onclick="this.closest('.card-body').querySelector('.comment-edit-form').hidden = false; this.hidden = true;">
                    Edit
                </button>
                <form method="post" th:if="${session.role == 'ADMIN' or session.userId == comment.user.id}"
                      th:action="${commentBase + '/comments/' + comment.id + '/delete'}">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Delete this comment and its replies?');">Delete</button>
                </form>
            </div>
            <form method="post" class="comment-edit-form mt-3" hidden
                  th:if="${session.userId != null and session.role != 'ADMIN' and session.userId == comment.user.id}"
                  th:action="${commentBase + '/comments/' + comment.id + '/edit'}">
                <textarea name="body" class="form-control mb-2" rows="3" th:text="${comment.body}"></textarea>
                <button type="submit" class="btn btn-sm btn-primary">Save edit</button>
            </form>
            <form method="post" class="comment-reply-form mt-3" hidden
                  th:if="${session.userId != null}"
                  th:action="${commentBase + '/comments/' + comment.id + '/replies'}">
                <label class="form-label">Reply</label>
                <textarea name="body" class="form-control mb-2" rows="2" maxlength="2000" required></textarea>
                <button type="submit" class="btn btn-sm btn-primary">Post reply</button>
            </form>
            <div class="mt-3" th:if="${!comment.replies.isEmpty()}">
                <th:block th:each="reply, loop : ${comment.replies}" th:if="${loop.index < 3}">
                    <div th:replace="~{fragments/comments :: thread(comment=${reply}, commentBase=${commentBase}, depth=${depth + 1})}"></div>
                </th:block>
                <details th:if="${comment.replies.size() > 3}" class="mt-2">
                    <summary class="text-muted">
                        Show <span th:text="${comment.replies.size() - 3}">more</span> more replies
                    </summary>
                    <th:block th:each="reply, loop : ${comment.replies}" th:if="${loop.index >= 3}">
                        <div th:replace="~{fragments/comments :: thread(comment=${reply}, commentBase=${commentBase}, depth=${depth + 1})}"></div>
                    </th:block>
                </details>
            </div>
        </div>
    </article>
</th:block>
</body>
</html>
