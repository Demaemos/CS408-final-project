<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title=${game.title})}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container my-5">
    <a th:href="@{/games}" class="text-decoration-none">&larr; All games</a>

    <div class="row mt-3 g-4">
        <div class="col-lg-8">
            <h1 th:text="${game.title}">Game Title</h1>
            <p class="lead text-muted" th:text="${game.tagline}">Tagline</p>

            <div class="mb-3">
                <span class="badge"
                      th:classappend="${game.releaseStatus.name() == 'RELEASED'} ? 'bg-success' : (${game.releaseStatus.name() == 'IN_DEV'} ? 'bg-warning text-dark' : 'bg-secondary')"
                      th:text="${game.releaseStatus.label}">Status</span>
                <span class="badge bg-dark" th:if="${game.esrbRating != null}"
                      th:text="'ESRB ' + ${game.esrbRating}">ESRB</span>
            </div>

            <div class="bg-secondary-subtle rounded p-5 text-center text-muted mb-4">
                Artwork and trailer coming soon
            </div>

            <h2 class="h4">About this game</h2>
            <p th:text="${game.description}">Description</p>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 card-title">Game facts</h2>
                    <dl class="mb-0">
                        <dt>Status</dt>
                        <dd th:text="${game.releaseStatus.label}">Announced</dd>

                        <dt>Release date</dt>
                        <dd th:text="${game.releaseDate != null} ? ${game.releaseDate} : 'TBA'">TBA</dd>

                        <dt>Genres</dt>
                        <dd th:text="${game.genres.isEmpty()} ? '&mdash;' : ${#strings.listJoin(#lists.sort(game.genres.![name]), ', ')}">Action</dd>

                        <dt>Platforms</dt>
                        <dd th:text="${game.platforms.isEmpty()} ? '&mdash;' : ${#strings.listJoin(#lists.sort(game.platforms.![name]), ', ')}">PC</dd>

                        <dt>Rating</dt>
                        <dd class="mb-0" th:text="${game.esrbRating != null} ? ${game.esrbRating} : 'Not yet rated'">E10+</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <section class="mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Comments</h2>
        </div>

        <div class="alert alert-success" th:if="${commentMessage != null}" th:text="${commentMessage}">Saved.</div>

        <div class="mb-4" th:if="${session.userId != null}">
            <form th:action="@{/games/{slug}/comments(slug=${game.slug})}" th:object="${commentForm}" method="post" novalidate>
                <label for="game-comment" class="form-label">Add a comment</label>
                <textarea id="game-comment" class="form-control" rows="4" th:field="*{body}" th:errorclass="is-invalid"></textarea>
                <div class="invalid-feedback" th:errors="*{body}">Error</div>
                <button type="submit" class="btn btn-primary mt-2">Post comment</button>
            </form>
        </div>

        <div class="alert alert-info" th:if="${session.userId == null}">Log in to join the discussion.</div>

        <div th:if="${#lists.isEmpty(comments)}" class="alert alert-light border">No comments yet.</div>

        <div class="list-group" th:unless="${#lists.isEmpty(comments)}">
            <div class="list-group-item" th:each="comment : ${comments}">
                <div class="d-flex justify-content-between">
                    <strong th:text="${comment.user.username}">User</strong>
                    <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'MMMM d, yyyy')}">Date</small>
                </div>
                <div class="mt-2" th:text="${comment.body}">Body</div>
                <div class="mt-3" th:if="${session.userId != null and (session.role == 'ADMIN' or comment.user.id == session.userId)}">
                    <form th:action="@{/games/{slug}/comments/{commentId}/edit(slug=${game.slug}, commentId=${comment.id})}" method="post" class="mb-2">
                        <textarea name="body" class="form-control mb-2" rows="3" th:text="${comment.body}"></textarea>
                        <button type="submit" class="btn btn-sm btn-outline-primary">Save edit</button>
                    </form>
                    <form th:action="@{/games/{slug}/comments/{commentId}/delete(slug=${game.slug}, commentId=${comment.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this comment?');">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
