<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title=${post.title})}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container my-5">
    <article>
        <div class="mb-3">
            <a href="/news" class="text-decoration-none">&larr; Back to news</a>
        </div>

        <h1 class="mb-3" th:text="${post.title}">News title</h1>
        <p class="text-muted" th:text="${#temporals.format(post.publishedAt, 'MMMM d, yyyy')}">Date</p>

        <div class="mb-4">
            <span class="badge bg-secondary me-1" th:each="tag : ${#strings.arraySplit(post.tags, ',')}" th:text="${tag.trim()}">tag</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-4" th:if="${post.image != null and !#strings.isEmpty(post.image)}">
                    <img th:src="${post.image}" class="img-fluid rounded" alt="News cover image">
                </div>
                <div th:text="${post.body}" style="white-space: pre-wrap;">Body</div>
            </div>
        </div>
    </article>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
