<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='News')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container my-5">
    <h1 class="mb-4">News &amp; Devlog</h1>

    <form method="get" th:action="@{/news}" class="row g-3 mb-4">
        <div class="col-md-5">
            <label for="keyword" class="form-label">Search</label>
            <input id="keyword" name="keyword" type="text" class="form-control"
                   th:value="${keyword}" placeholder="Search posts or tags">
        </div>

        <div class="col-md-4">
            <label for="tag" class="form-label">Tag</label>
            <select id="tag" name="tag" class="form-select">
                <option value="">All tags</option>
                <option th:each="tagName : ${tags}" th:value="${tagName}" th:text="${tagName}"
                        th:selected="${tagName == selectedTag}">devlog</option>
            </select>
        </div>

        <div class="col-md-3 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/news}" class="btn btn-outline-secondary">Reset</a>
        </div>
    </form>

    <p class="text-muted" th:if="${newsPage != null}"
       th:text="${newsPage.totalElements} + ' post(s) found'">0 posts found</p>

    <div th:if="${#lists.isEmpty(posts)}" class="alert alert-info">
        No news posts match the current filters.
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(posts)}">
        <div class="col-md-6" th:each="post : ${posts}">
            <article class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="mb-2">
                        <span class="badge bg-secondary me-1" th:each="tagName : ${#strings.arraySplit(post.tags, ',')}" th:text="${tagName.trim()}">tag</span>
                    </div>
                    <h2 class="h5 card-title" th:text="${post.title}">Title</h2>
                    <p class="text-muted small mb-2"
                       th:text="${#temporals.format(post.publishedAt, 'MMMM d, yyyy')}">Date</p>
                    <p class="card-text" th:text="${#strings.abbreviate(post.body, 180)}">Summary</p>
                    <a class="btn btn-outline-primary mt-auto" th:href="@{/news/{slug}(slug=${post.slug})}">Read more</a>
                </div>
            </article>
        </div>
    </div>

    <nav th:if="${newsPage != null and newsPage.totalPages > 1}" aria-label="News pagination" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${newsPage.first} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/news(page=${newsPage.number - 1}, keyword=${keyword}, tag=${selectedTag})}">Previous</a>
            </li>
            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, newsPage.totalPages - 1)}"
                th:classappend="${pageNumber == newsPage.number} ? 'active' : ''">
                <a class="page-link" th:href="@{/news(page=${pageNumber}, keyword=${keyword}, tag=${selectedTag})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${newsPage.last} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/news(page=${newsPage.number + 1}, keyword=${keyword}, tag=${selectedTag})}">Next</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
